[package]
name = "nanoburngpt"
version = "0.1.0"
edition = "2024"

[features]
default = ["wgpu", "tui"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
cpu = ["burn/flex"]
# Enables the interactive ratatui dashboard during training. Disabling this
# feature (e.g. `--no-default-features --features cuda`) forces Burn's plain
# CliMetricsRenderer in `src/train.rs` while keeping `burn`'s default features
# (kernel fusion, autotune, cubecl stdlib) intact.
tui = ["burn/tui"]

[dependencies]
anyhow = "1.0.102"
burn = { version = "0.22.1", features = ["train", "flex"] }
clap = { version = "4.6.0", features = ["derive"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
tiktoken-rs = "0.9.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bench]]
name = "throughput"
harness = false

# Temporary workaround for upstream pliron 0.19.0 breakage:
# Location derives Hash but combine 4.x SourcePosition has no Hash impl.
# Vendored copy removes the derive and hashes line/column manually.
# TODO: remove once upstream pliron releases a fix.
[patch.crates-io]
pliron = { path = "vendor/pliron" }
