[package]
name = "nanoburngpt"
version = "0.1.0"
edition = "2024"

[features]
default = ["wgpu"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
cpu = []

[dependencies]
anyhow = "1.0.102"
burn = { version = "0.21.0", features = ["train", "tui"] }
clap = { version = "4.6.0", features = ["derive"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
tiktoken-rs = "0.9.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
burn-flex = "0.21.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false
