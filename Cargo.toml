[package]
name = "nanoburngpt"
version = "0.1.0"
edition = "2024"

[features]
default = ["wgpu"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
cpu = ["burn/flex"]

[dependencies]
anyhow = "1.0.102"
burn = { version = "0.22.0", features = ["train", "tui", "flex"] }
clap = { version = "4.6.0", features = ["derive"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
tiktoken-rs = "0.9.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
burn-flex = "0.22.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bench]]
name = "throughput"
harness = false

# Temporary workaround for upstream pliron 0.19.0 breakage:
# Location derives Hash but combine 4.x SourcePosition has no Hash impl.
# Vendored copy removes the derive and hashes line/column manually.
# TODO: remove once upstream pliron releases a fix.
[patch.crates-io]
pliron = { path = "vendor/pliron" }
