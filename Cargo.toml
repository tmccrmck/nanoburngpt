[package]
name = "nanoburngpt"
version = "0.1.0"
edition = "2024"

[features]
default = ["wgpu", "tui", "persistence"]
wgpu = ["burn/wgpu"]
# Native GPU shader backends for `wgpu` (Apple Silicon MSL / Vulkan SPIR-V)
# instead of generic WGSL.
metal = ["wgpu", "burn/metal"]
vulkan = ["wgpu", "burn/vulkan"]
cuda = ["burn/cuda", "dep:cubecl-cuda"]
cpu = ["burn/flex"]
# Hardware-accelerated CPU GEMM backends for `burn-flex`.
apple-amx = ["burn/apple-amx"]
x86-v4 = ["burn/x86-v4"]
# Enables the interactive ratatui dashboard during training. Disabling this
# feature (e.g. `--no-default-features --features cuda`) excludes ratatui and
# forces Burn's plain CliMetricsRenderer in `src/train.rs`.
tui = ["burn/tui"]
# Enables on-disk CubeCL autotune/kernel cache (pulls in turso). Useful for
# local dev; omit on ephemeral cloud VMs (`--no-default-features --features cuda`).
persistence = ["burn/persistence"]

[dependencies]
anyhow = "1.0.102"
burn = { version = "0.22.1", default-features = false, features = [
    "std",
    "train",
    "flex",
    "fusion",
    "autotune",
    "simd",
    "rayon",
] }
clap = { version = "4.6.0", features = ["derive"] }
# Select CubeCL's NVRTC C++ backend instead of the experimental LLVM/pliron backend,
# which panics on Flex32 intrinsics/constants in cubecl-llvm 0.11.4.
cubecl-cuda = { version = "0.11.4", optional = true, default-features = false, features = ["cpp"] }
tiktoken-rs = "0.9.1"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[[bench]]
name = "throughput"
harness = false
